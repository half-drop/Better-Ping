name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Build and test
        run: bash ./gradlew build --no-daemon --console=plain
      - name: Add checksums
        working-directory: build/libs
        run: sha256sum *.jar > SHA256SUMS.txt
      - name: Upload mod
        uses: actions/upload-artifact@v7
        with:
          name: BetterPingDisplay-Fabric-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/libs/SHA256SUMS.txt
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.sha }}
          path: build/reports/tests/test/
          if-no-files-found: ignore
