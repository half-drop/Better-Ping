plugins {
	id 'java'
	id 'net.fabricmc.fabric-loom' version '1.16.0-alpha.16'
	id 'maven-publish'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

base {
	archivesName = project.archives_base_name
}
version = "${minecraft_version}-${project.mod_version}"
group = project.maven_group
minecraft_version = project.minecraft_version

loom {
	splitEnvironmentSourceSets()

	mods {
		betterpingdisplay {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	testImplementation 'junit:junit:4.13'
}

processResources {
	duplicatesStrategy = 'WARN'

	filesMatching("fabric.mod.json") {
		expand "version": project.mod_version, "minecraft_version": minecraft_version
	}
}

tasks.withType(JavaCompile) {
	options.encoding = "UTF-8"
}


jar {
	from "LICENSE"
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	// select the repositories you want to publish to
	repositories {
		// uncomment to publish to the local maven
		// mavenLocal()
	}
}

sourceSets {
	main.java {
		include 'com/vladmarica/betterpingdisplay/**/*'
		exclude 'net/fabricmc/*'
	}
	test.java {
		include 'com/vladmarica/betterpingdisplay/**/*'
	}
}

test {
	useJUnit()
}
